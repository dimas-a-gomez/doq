<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="-16" dy="-16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8" />
    </filter>
    <filter id="inner-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ffffff" flood-opacity="0.8" />
    </filter>
  </defs>
  
  <clipPath id="app-clip">
    <rect x="0" y="0" width="512" height="512" rx="112" />
  </clipPath>

  <g clip-path="url(#app-clip)">
    <!-- Black Background -->
    <rect x="0" y="0" width="512" height="512" fill="#050505" />

    <!-- White Card -->
    <!-- Place exactly positioned to create the black 'L' shape on Top and Left -->
    <rect x="115" y="115" width="450" height="450" rx="48" fill="#f4f4f5" filter="url(#shadow)" />
    
    <!-- Group for soft 3D elements inside card -->
    <g>
      <!-- Element 1: Rounded Square -->
      <!-- Backing with slight drop shadow -->
      <rect x="166" y="170" width="148" height="148" rx="36" fill="#ccd6ed" filter="url(#shadow)" opacity="0.1" />
      <rect x="166" y="170" width="148" height="148" rx="36" fill="#dde4f5" />
      <!-- Borders -->
      <rect x="166" y="170" width="148" height="148" rx="36" fill="none" stroke="#b1c0e8" stroke-width="6" opacity="0.5" />

      <!-- Element 2: Top Bar -->
      <rect x="166" y="344" width="302" height="58" rx="29" fill="#ccd6ed" filter="url(#shadow)" opacity="0.1" />
      <rect x="166" y="344" width="302" height="58" rx="29" fill="#dde4f5" />
      <!-- Borders -->
      <rect x="166" y="344" width="302" height="58" rx="29" fill="none" stroke="#b1c0e8" stroke-width="6" opacity="0.5" />
      
      <!-- Element 3: Bottom Bar -->
      <rect x="166" y="424" width="302" height="58" rx="29" fill="#ccd6ed" filter="url(#shadow)" opacity="0.1" />
      <rect x="166" y="424" width="302" height="58" rx="29" fill="#dde4f5" />
      <rect x="166" y="424" width="302" height="58" rx="29" fill="none" stroke="#b1c0e8" stroke-width="6" opacity="0.5" />
    </g>
  </g>
</svg>
